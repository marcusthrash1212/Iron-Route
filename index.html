<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14171C">
<meta name="mobile-web-app-capable" content="yes">
<title>Iron Route</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#E4E6E1}
  :root{--concrete:#E4E6E1;--concrete-2:#D3D6D0;--ink:#14171C;--ink-soft:#5A6068;--line:#B9BDB6;
    --p-none:#C2C6BF;--p-green:#1E9E5A;--p-yellow:#E8B400;--p-blue:#1F5FA9;--p-red:#C7302B;--card:#F2F3F0;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  #ir{font-family:'Barlow',system-ui,sans-serif;background:var(--concrete);color:var(--ink);min-height:100vh;padding-bottom:96px;line-height:1.45}
  #ir h1,#ir h2,#ir h3{font-family:'Anton',Impact,'Arial Narrow',sans-serif;font-weight:400;margin:0;text-transform:uppercase}
  #ir .num{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
  .top{background:var(--ink);color:var(--concrete);padding:12px 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .top h1{font-size:24px;line-height:1}
  .top .sub{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8C939B;margin-top:3px}
  .sess{text-align:right;flex:none}
  .sess .t{font-family:'JetBrains Mono';font-size:20px;font-weight:700;color:#fff}
  .sess .l{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#868D95}
  .tabs{display:flex;background:var(--ink);border-top:1px solid #2A2F36;position:sticky;top:0;z-index:20}
  .tabs button{flex:1;background:none;border:0;color:#868D95;font-family:'Barlow';font-size:10.5px;font-weight:600;
    letter-spacing:.08em;text-transform:uppercase;padding:11px 2px;cursor:pointer;border-bottom:3px solid transparent}
  .tabs button.on{color:#fff;border-bottom-color:var(--p-red)}
  .wrap{padding:16px;max-width:660px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);padding:14px;margin-bottom:12px}
  .card h2{font-size:17px;margin-bottom:2px}
  .eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
  .btn{background:var(--ink);color:#fff;border:0;padding:12px 18px;font-family:'Barlow';font-weight:700;
    font-size:13px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;width:100%}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--ink)}
  .btn.sm{width:auto;padding:8px 13px;font-size:11px}
  .btn.red{background:var(--p-red)}.btn.green{background:var(--p-green)}.btn.blue{background:var(--p-blue)}
  .btn[disabled]{opacity:.45;cursor:default}
  input,select,textarea{font-family:'Barlow';font-size:16px;padding:9px 10px;border:1.5px solid var(--line);
    background:#fff;color:var(--ink);width:100%;border-radius:0}
  input:focus,select:focus,button:focus-visible{outline:3px solid var(--p-blue);outline-offset:1px}
  label{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--ink-soft);margin-bottom:4px}
  .field{margin-bottom:12px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .ex{border-top:1px solid var(--line);padding:12px 0}.ex:first-of-type{border-top:0}
  .ex.grp{border-left:3px solid var(--p-blue);padding-left:10px;margin-left:-3px}
  .ex-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .ex-n{font-weight:700;font-size:15px}.ex-t{font-size:12px;color:var(--ink-soft);white-space:nowrap}
  .tempo{font-size:11px;color:var(--ink-soft);font-family:'JetBrains Mono';margin-top:2px}
  .target{font-size:12.5px;color:var(--p-blue);font-weight:700;margin-top:3px}
  .sets{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .set{display:grid;grid-template-columns:24px 1fr 1fr 40px;gap:6px;align-items:center}
  .set .idx{font-size:12px;font-weight:700;color:var(--ink-soft);text-align:center}
  .set input{text-align:center;padding:8px 4px;font-family:'JetBrains Mono';font-size:15px}
  .set input.done{background:#E3F2E9;border-color:var(--p-green)}
  .tick{border:1.5px solid var(--line);background:#fff;cursor:pointer;height:38px;font-size:16px;color:var(--p-green)}
  .tick.on{background:var(--p-green);border-color:var(--p-green);color:#fff}
  .pill{display:inline-block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
    padding:3px 7px;background:var(--ink);color:#fff;margin-right:5px}
  .pill.am{background:var(--p-blue)}.pill.pm{background:var(--ink-soft)}.pill.rec{background:var(--p-green)}
  .pill.grp{background:var(--p-blue)}.pill.dl{background:var(--p-yellow);color:var(--ink)}
  .stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dotted var(--line);font-size:14px}
  .stat:last-child{border-bottom:0}.stat b{font-family:'JetBrains Mono';font-weight:700}
  .bar{height:22px;background:var(--concrete-2);border:1px solid var(--line);position:relative;overflow:hidden}
  .bar span{display:block;height:100%;background:var(--p-green);transition:width .3s}
  .bar em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-style:normal;font-size:11px;font-weight:700;font-family:'JetBrains Mono'}
  .legend{display:flex;gap:2px;margin-top:10px;font-size:9px;text-align:center}
  .legend div{flex:1}.legend i{display:block;height:10px;margin-bottom:3px}
  .usual{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .usual small{color:var(--ink-soft);font-family:'JetBrains Mono';font-size:11px}
  .add{border:1.5px solid var(--ink);background:#fff;width:34px;height:34px;font-size:18px;font-weight:700;cursor:pointer;flex:none}
  .timer{position:fixed;bottom:0;left:0;right:0;background:var(--ink);color:#fff;padding:10px 16px;
    display:none;align-items:center;justify-content:space-between;z-index:30}
  .timer.on{display:flex}.timer .t{font-family:'JetBrains Mono';font-size:26px;font-weight:700}
  .note{font-size:13px;color:var(--ink-soft);border-left:3px solid var(--p-yellow);padding-left:10px;margin-top:10px}
  .muted{color:var(--ink-soft);font-size:13px}
  .cues{margin-top:8px;border:1px solid var(--line);background:#fff}
  .cues summary{cursor:pointer;padding:8px 10px;font-size:10.5px;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-soft);list-style:none;display:flex;align-items:center;gap:8px}
  .cues summary::-webkit-details-marker{display:none}
  .cues summary::before{content:'▸';font-size:12px}.cues[open] summary::before{content:'▾'}
  .cues[open] summary{border-bottom:1px solid var(--line)}
  .cues ul{margin:0;padding:10px 10px 4px 26px}.cues li{font-size:13.5px;margin-bottom:6px}
  .qr{background:var(--p-blue);color:#fff;padding:2px 6px;font-size:9px}
  .hist{padding:8px 10px;font-size:12.5px;font-family:'JetBrains Mono';border-top:1px solid var(--line)}
  .hist div{display:flex;justify-content:space-between;padding:2px 0}
  .demo{display:block;padding:9px 10px;border-top:1px solid var(--line);font-size:11.5px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;color:var(--ink);text-decoration:none}
  .banner{background:var(--ink);color:#fff;padding:12px 14px;margin-bottom:12px}
  .banner.dl{background:var(--p-yellow);color:var(--ink)}
  .banner .eyebrow{color:#8C939B}.banner.dl .eyebrow{color:#6B5A00}
  .edrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .mini{display:flex;gap:4px}
  .mini button{border:1px solid var(--line);background:#fff;width:30px;height:30px;cursor:pointer;font-size:13px;font-weight:700}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .savefail{background:var(--p-red);color:#fff;padding:12px 16px;font-weight:700;font-size:14px;position:sticky;top:0;z-index:40}
  .ready{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .ready button{border:1.5px solid var(--ink);background:#fff;color:var(--ink);font-family:'Barlow';font-weight:700;
    font-size:13px;padding:12px 2px;cursor:pointer}
  .ready button.on{background:var(--ink);color:#fff}
  .overlay{position:fixed;inset:0;background:rgba(20,23,28,.6);z-index:50;overflow-y:auto;padding:16px}
  .overlay .sheet{max-width:520px;margin:24px auto}
  .urow{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;text-align:left;
    background:none;border:0;border-bottom:1px solid var(--line);padding:11px 0;font-family:'Barlow';font-size:14.5px;
    color:var(--ink);cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .urow:active{background:var(--concrete-2)}
  .urow .un{display:block;font-weight:600}
  .urow small{color:var(--ink-soft);font-family:'JetBrains Mono';font-size:11px}
  .urow .plus{border:1.5px solid var(--ink);background:#fff;width:34px;height:34px;display:flex;align-items:center;
    justify-content:center;font-size:18px;font-weight:700;flex:none}
  .lockpick{display:grid;gap:6px}
  .lockpick button{text-align:left;border:1.5px solid var(--line);background:#fff;padding:10px 12px;cursor:pointer;font-family:'Barlow';color:var(--ink)}
  .lockpick button b{display:block;font-size:14px}.lockpick button span{font-size:12.5px;color:var(--ink-soft)}
  .lockpick button.on{border-color:var(--ink);border-width:2.5px;background:#E9EBE6}
  .lockpick button em{display:inline-block;margin-top:5px;font-style:normal;font-size:9.5px;letter-spacing:.1em;
    text-transform:uppercase;font-weight:700;background:var(--p-green);color:#fff;padding:2px 6px}
  .warm{border:1.5px dashed var(--ink-soft);padding:10px 12px;margin-bottom:6px;background:#fff}
  .warm ol{margin:8px 0 10px;padding-left:20px}.warm li{font-size:13.5px;margin-bottom:5px}
  .tbtn{background:none;border:0;padding:4px 0;text-align:left;cursor:pointer;display:block}
  .set.withtp{grid-template-columns:24px 1.1fr 1fr 1fr 40px}
  #ir .set input.tpin{font-size:13px;padding:8px 2px}
  #ir input.bad{border-color:var(--p-red);background:#FBE9E8}
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .mchk{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);
    font-weight:500;border:1.5px solid var(--line);background:#fff;padding:9px 10px;margin:0;cursor:pointer}
  .mchk input{width:auto;margin:0;flex:none}
  .add.saved{border-color:var(--p-yellow);color:#8a6a00;cursor:default}
  .toast{position:fixed;left:12px;right:12px;bottom:84px;z-index:60;background:var(--ink);color:#fff;padding:10px 12px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;font-size:14px;max-width:560px;margin:0 auto}
  .photo-prev{display:block;max-width:100%;max-height:240px;margin-top:10px;border:1.5px solid var(--line)}
  .thumb{width:44px;height:44px;object-fit:cover;border:1px solid var(--line);flex:none}
  .err{color:var(--p-red);font-weight:700;font-size:14px;margin-top:8px}
  .hide{display:none!important}
</style>
</head>
<body>

<div id="ir">
  <div class="savefail hide" id="savefail" role="alert"></div>
  <div class="top">
    <div><h1>Iron Route</h1><div class="sub" id="topsub">Loading</div></div>
    <div class="sess" id="sess"></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="wrap" id="view"></div>
  <div class="overlay hide" id="overlay"></div>
  <div class="overlay hide" id="sheet"></div>
  <div class="toast hide" id="toast" role="status"></div>
  <div class="timer" id="timer">
    <div><div class="eyebrow" style="color:#868D95">Rest</div><div class="t" id="tdisp">2:00</div></div>
    <div style="display:flex;gap:8px">
      <button class="btn sm ghost" style="color:#fff;border-color:#fff" onclick="IR.addRest(30)">+30s</button>
      <button class="btn sm red" onclick="IR.stopRest()">Skip</button>
    </div>
  </div>
</div>

<script>
const IR=(function(){
"use strict";

/* ================= storage (IndexedDB) ================= */
/* Every write commits with strict durability and is read back inside the same
   transaction. A failed write shows a red banner; it never fails silently. */
const DB_NAME='iron-route',STORE='kv',mem={};
let dbp=null,failed={},persisted=null;
function db(){
  return dbp=dbp||new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=()=>r.result.createObjectStore(STORE);
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('Database blocked'));
  });
}
function tx(mode,fn){
  return db().then(d=>new Promise((res,rej)=>{
    const t=mode==='readwrite'?d.transaction(STORE,mode,{durability:'strict'}):d.transaction(STORE,mode);
    const out=fn(t.objectStore(STORE));
    t.oncomplete=()=>res(out);t.onerror=t.onabort=()=>rej(t.error||new Error('Transaction aborted'));
  }));
}
async function get(k,d){
  try{const v=(await tx('readonly',s=>s.get(k))).result;return v===undefined?(mem[k]!==undefined?mem[k]:d):v;}
  catch(e){saveFailed(k,e);return mem[k]!==undefined?mem[k]:d;}
}
async function set(k,v){
  mem[k]=v;
  const snap=JSON.stringify(v);
  try{
    let check;
    await tx('readwrite',s=>{s.put(JSON.parse(snap),k);check=s.get(k);});
    if(JSON.stringify(check.result)!==snap)throw new Error('Read-back did not match');
    if(failed[k]){delete failed[k];drawFail();}
  }catch(e){saveFailed(k,e);}
}
async function getAllKeys(){try{return (await tx('readonly',s=>s.getAllKeys())).result;}catch(e){return Object.keys(mem);}}
function saveFailed(k,e){failed[k]=String(e&&e.message||e);drawFail();}
function drawFail(){
  const el=document.getElementById('savefail');if(!el)return;
  const ks=Object.keys(failed);
  el.classList.toggle('hide',!ks.length);
  el.innerHTML=ks.length?`Save failed. Your latest changes are on screen but NOT stored on this phone.
    <button class="btn sm" style="background:#fff;color:var(--p-red);margin-top:8px;display:block" onclick="IR.exportAll()">Export my data now</button>`:'';
}
async function askPersist(){
  try{
    if(!navigator.storage||!navigator.storage.persist)return;
    persisted=await navigator.storage.persisted();
    if(!persisted)persisted=await navigator.storage.persist();
  }catch(e){}
}

/* ================= muscles ================= */
const M={chest:'Chest',delts:'Shoulders',rear:'Rear delts',biceps:'Biceps',triceps:'Triceps',
 forearms:'Forearms',abs:'Abs',lats:'Lats',upback:'Upper back',lowback:'Lower back',
 quads:'Quads',hams:'Hamstrings',glutes:'Glutes',calves:'Calves'};

/* ================= exercise library ================= */
/* q:1 = Matrix machine with a QR demo code on the shroud */
const LIB=[
 {n:'Barbell Back Squat',m:['quads','glutes'],rest:180,cat:'Quads',c:['Bar on your rear delts, not your neck.','Hips and knees break together, knees track over toes.','Down slow, up fast. End the set when depth shrinks.']},
 {n:'Leg Press',m:['quads','glutes'],rest:120,q:1,cat:'Quads',c:['Feet mid-platform, shoulder width.','Down to about 90°, no tailbone rounding.','Never slam the knees straight at the top.']},
 {n:'Leg Extension',m:['quads'],rest:60,q:1,cat:'Quads',c:['Back pad set so knees align with the orange pivot.','One-second hold at full extension.']},
 {n:'Hack Squat',m:['quads','glutes'],rest:150,cat:'Quads',c:['Feet slightly forward to spare the knees.','Control the descent, no bouncing.']},
 {n:'Goblet Squat',m:['quads','glutes'],rest:90,cat:'Quads',c:['Dumbbell at your chest, elbows inside your knees.','Great warm-up before barbell work.']},
 {n:'Walking Lunge',m:['quads','glutes'],rest:90,cat:'Quads',c:['Long step, back knee toward the floor.','Torso stays tall the whole way.']},
 {n:'Bulgarian Split Squat',m:['quads','glutes'],rest:90,cat:'Quads',c:['Back foot on a bench, front shin near vertical.','Brutal at light weight. Start with bodyweight.']},
 {n:'Romanian Deadlift',m:['hams','glutes','lowback'],rest:150,cat:'Hamstrings',c:['Soft knees, push hips back like closing a truck door.','Bar scrapes your thighs the whole way.','Stop when the hamstrings say stop.']},
 {n:'Prone Leg Curl',m:['hams'],rest:90,q:1,cat:'Hamstrings',c:['Knees on the orange pivot, pad above the heels.','Hips flat — no arching to cheat it up.','Three seconds down.']},
 {n:'Seated Leg Curl',m:['hams'],rest:60,q:1,cat:'Hamstrings',c:['Thigh pad snug, leg pad below the ankles.','Fight the weight for three seconds coming back.']},
 {n:'Good Morning',m:['hams','lowback'],rest:120,cat:'Hamstrings',c:['Light weight. This is a hamstring stretch, not a max lift.']},
 {n:'Hip Thrust',m:['glutes','hams'],rest:120,cat:'Glutes',c:['Shoulder blades on the bench, chin tucked.','Squeeze at the top, ribs down.']},
 {n:'Glute Machine',m:['glutes'],rest:60,q:1,cat:'Glutes',c:['Chest pad set so your back stays flat.','Drive through the heel, squeeze, no arching.']},
 {n:'Hip Abductor',m:['glutes'],rest:45,q:1,cat:'Glutes',c:['Knee pads rotated outward for abduction.','Lean forward slightly to bias the upper glute.']},
 {n:'Back Extension',m:['lowback','glutes'],rest:75,q:1,cat:'Glutes',c:['Hips on the orange pivot.','Rise to a straight line — never hyperextend backward.','Squeeze glutes, not low back.']},
 {n:'Calf Extension',m:['calves'],rest:60,q:1,cat:'Calves',c:['Full stretch at the bottom, one-second squeeze at the top.','Slow beats heavy. Calves respond to time.']},
 {n:'Calf Press on Leg Press',m:['calves'],rest:60,q:1,cat:'Calves',c:['Toes on the edge of the platform, knees soft.','Full range every rep.']},
 {n:'Standing Calf Raise',m:['calves'],rest:60,cat:'Calves',c:['Pause at the bottom stretch for a full second.']},
 {n:'Converging Chest Press',m:['chest','triceps','delts'],rest:150,q:1,cat:'Chest',c:['Seat so handles land at mid-chest.','Let the handles converge — that squeeze is the point.','Stop just short of locking out.']},
 {n:'Barbell Bench Press',m:['chest','triceps','delts'],rest:180,cat:'Chest',c:['Shoulder blades pinned back and down.','Bar to your lower chest, elbows at 45°.','Use a spotter or the rack pins.']},
 {n:'Incline DB Press',m:['chest','delts'],rest:120,cat:'Chest',c:['Bench at 30°. Steeper turns it into a shoulder press.','Elbows at 45°, not flared to 90°.','Bring the bells together at the top.']},
 {n:'Flat DB Press',m:['chest','triceps'],rest:120,cat:'Chest',c:['Deep stretch at the bottom, controlled.','Wrists stacked over elbows.']},
 {n:'Cable Fly',m:['chest'],rest:60,cat:'Chest',c:['Small elbow bend, locked there all set.','Cross your hands slightly past each other.']},
 {n:'Pec Deck',m:['chest'],rest:60,q:1,cat:'Chest',c:['Elbows at chest height on the pads.','Two-second squeeze at the middle.']},
 {n:'Push-up',m:['chest','triceps'],rest:60,cat:'Chest',c:['Body in one line, ribs down.','Elevate your hands on a bench if reps are low.']},
 {n:'Lat Pulldown',m:['lats','biceps'],rest:120,q:1,cat:'Back',c:['Thigh pad snug so you stay planted.','Bar to your collarbone, elbows to your back pockets.','Pull with the elbows, not the hands.']},
 {n:'Lat Pulldown (wide)',m:['lats'],rest:90,q:1,cat:'Back',c:['Wider grip, pull slightly further from the chest.','Feel it under the armpits — that is the lat.']},
 {n:'Seated Cable Row',m:['upback','lats','biceps'],rest:150,cat:'Back',c:['Chest tall, no rocking from the hips.','Pull to your belly button, elbows past your ribs.','Let the stretch open your shoulder blades up front.']},
 {n:'Cable Row (neutral grip)',m:['upback','lats'],rest:90,cat:'Back',c:['Lighter, no body english.','Two-second squeeze at the ribs every rep.']},
 {n:'Chest-Supported DB Row',m:['upback','rear'],rest:120,cat:'Back',c:['Bench at 45°, chest glued to the pad.','Row toward your hips, squeeze for a beat.','Shrugging traps means too heavy.']},
 {n:'Barbell Row',m:['upback','lats'],rest:150,cat:'Back',c:['Hinge to about 45°, back flat.','Bar to your belly, no jerking with the hips.']},
 {n:'Single-Arm DB Row',m:['lats','upback'],rest:90,cat:'Back',c:['Hand and knee on the bench, back flat.','Row to your hip, not your armpit.']},
 {n:'Straight-Arm Pulldown',m:['lats'],rest:60,cat:'Back',c:['Arms nearly locked, hinge slightly forward.','Pure lat isolation — go light.']},
 {n:'Pull-up',m:['lats','biceps'],rest:150,cat:'Back',c:['Full hang at the bottom every rep.','Use a band or the assisted machine until you get 8.']},

async function migrate(){

  const up=e=>{if(e&&/^[0-9X]-[0-9X]-[0-9X]$/i.test(e.tempo||'')){e.tempo=e.tempo.toUpperCase()+'-0';return true;}return false;};
  const each=(list,f)=>(list||[]).reduce((a,e)=>f(e)||a,false);
  if(PLAN&&Object.values(PLAN).reduce((a,day)=>each(day&&day.ex,up)||a,false))await set('ir:plan',PLAN);
  if(Object.values(XTRA).reduce((a,l)=>each(l,up)||a,false))await set('ir:extras',XTRA);

/* An open session older than the resume window was abandoned (app closed and
   never finished). Close it at its last logged set so its work still counts. */
async function closeStale(){
  let changed=false;
  Object.keys(SESS).forEach(k=>{
    const s=SESS[k];if(!s.start||s.end||Date.now()-s.start<OPEN_MS)return;
    const ts=Object.values(LOGS[k]||{}).flat().map(x=>x.t||0);
    s.end=Math.max(s.start,...ts);s.auto=true;changed=true;
  });
  if(changed)await set('ir:sessions',SESS);
}

/* ================= targets & blocks ================= */
function computeTargets(p){
  const pr=PRESETS[p.preset]||PRESETS.recomp;
  const bmr=10*(p.wt*.4536)+6.25*(p.ht*2.54)-5*p.age+5;
  const tdee=bmr*1.7;
  return{bmr:Math.round(bmr),tdee:Math.round(tdee),
    kcal:Math.round((tdee+pr.kcalAdj)/10)*10,
    prot:Math.round(p.wt*pr.protMult),
    waistGoal:Math.round(p.ht*.5*10)/10};
}
function blockInfo(){
  const wks=Math.max(0,Math.floor((new Date()-new Date(P.start+'T00:00:00'))/6048e5));
  const pos=wks%7;                       // 7-week cycle: 3 blocks of 2 + deload
  if(pos===6)return{week:7,label:'Deload week',pct:-40,deload:true,
    msg:'Cut every working weight by 40% and stop two reps short. This is what makes the next block possible.'};
  const block=Math.floor(pos/2)+1, pct=[0,5,10][block-1];
  return{week:pos+1,block,pct,deload:false,
    msg:block===1?'Baseline block. Find your working weights and log them honestly.'
      :`Block ${block}. Add about ${pct}% to the weights you used in block 1.`};
}

/* ================= session timer ================= */
function sessRec(){return SESS[curKey()]||null;}
/* Creates the session record if it doesn't exist yet. Never resets a running one. */
async function ensureSess(){
  const k=curKey();
  if(SESS[k])return false;
  SESS[k]={start:Date.now(),end:null};await set('ir:sessions',SESS);return true;
}
async function startSess(){await ensureSess();render();}
/* Finishing stamps the end time right away; the readiness tap is optional on top. */
async function endSess(){
  const k=curKey(),s=SESS[k];
  if(s&&!s.end){s.end=Date.now();await set('ir:sessions',SESS);}
  justEnded=k;
  if(P.pendingPreset)await applyPreset(P.pendingPreset);
  render();window.scrollTo(0,0);
}
const READY=[['strong','Strong'],['normal','Normal'],['rough','Rough'],['wrecked','Wrecked']];
async function setReady(v){

function tickSess(){
  const el=document.getElementById('sess');if(!el||!P)return;
  const s=sessRec();
  if(!s){el.innerHTML='';return;}
  const ms=(s.end||Date.now())-s.start,m=Math.floor(ms/6e4),sec=Math.floor(ms/1e3)%60;

}

/* ================= audio ================= */
let AC=null;
function ding(){
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    [0,.18,.36].forEach((t,i)=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.connect(g);g.connect(AC.destination);
      o.frequency.value=i===2?1046:784;o.type='sine';
      const st=AC.currentTime+t;
      g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(.35,st+.02);
      g.gain.exponentialRampToValueAtTime(.001,st+.42);
      o.start(st);o.stop(st+.45);
    });
  }catch(e){}
  if(navigator.vibrate)navigator.vibrate([250,120,250]);
}

/* Import accepts this version's export and the v2 prototype's export. */
function parseImport(text){
  let o;
  try{o=JSON.parse(String(text).trim());}
  catch(e){throw new Error("That isn't readable data. Make sure you copied all of it, from the first { to the last }.");}
  let d;
  if(o&&o.format==='iron-route'&&o.data&&typeof o.data==='object')d=o.data;
  else if(o&&typeof o==='object'&&(o.profile||o.logs))d={profile:o.profile,plan:o.plan,logs:o.logs,sessions:o.sessions,
    body:o.body,fuel:o.fuel,savedFoods:o.custom};
  else throw new Error("That doesn't look like an Iron Route export.");
  const out={};
  Object.keys(KEYS).forEach(n=>{
    const v=d[n],b=BLANK[n];
    const ok=v!=null&&(b===null?typeof v==='object':Array.isArray(b)?Array.isArray(v):typeof v==='object'&&!Array.isArray(v));
    out[n]=ok?v:(b&&typeof b==='object'?JSON.parse(JSON.stringify(b)):b);
  });
  if(out.profile){
    if(!PRESETS[out.profile.preset])out.profile.preset='recomp';
    if(!out.profile.start)out.profile.start=todayKey();
    out.profile.t=computeTargets(out.profile);
    if(!out.plan)out.plan=seedPlan(out.profile.preset);
  }
  return{v2:!(o.format==='iron-route'),data:out};
}

/* ================= progression ================= */
function historyFor(name,limit){
  const days=Object.keys(LOGS).filter(d=>LOGS[d][name]&&LOGS[d][name].some(s=>s.done)).sort().reverse();
  return days.slice(0,limit||5).map(d=>({d,sets:LOGS[d][name].filter(s=>s.done)}));
}
function suggest(e){
  // Previous sessions only: today's ticked sets aren't "last time".
  const h=historyFor(e.n,2).filter(x=>x.d!==curKey()).slice(0,1);
  if(!h.length)return{txt:e.w?`Planned: ${e.w} lb × ${e.r}. Adjust if it feels off, and log it.`:'First time — pick a weight you could do two more reps with, and log it.',cls:''};
  /* A missed-rep adjustment last session is this session's starting point. */
  const a=(SESS[h[0].d]||{}).adj&&SESS[h[0].d].adj[e.n];
  if(a&&!blockInfo().deload)return{txt:a.choice==='lower'
    ?`Start at ${a.w} lb × ${a.lo} — last time's adjusted weight.`
    :`Start at ${a.w?a.w+' lb':'the same weight'}, aim for ${a.lo}–${a.hi} reps — last time's adjusted target.`,cls:''};
  const sets=h[0].sets.filter(s=>+s.w>0);
  if(!sets.length)return{txt:'No weight logged last time. Enter one today so the app can progress you.',cls:''};
  const top=sets.reduce((a,b)=>+b.w>+a.w?b:a);
  const b=blockInfo();
  if(b.deload)return{txt:`Deload: use ${Math.round(+top.w*.6/5)*5} lb and stop two reps short.`,cls:'dl'};
  const allTop=sets.every(s=>+s.r>=(e.hi||99));
  if(allTop){
    const inc=(e.m&&(e.m.includes('quads')||e.m.includes('hams')||e.m.includes('glutes')))?10:5;
    return{txt:`You hit the top of the range everywhere last time. Go to ${+top.w+inc} lb × ${e.lo}.`,cls:'up'};
  }
  return{txt:`Last: ${top.w} × ${top.r}. Same weight, add one rep per set.`,cls:''};
}

/* Working weight for the ramp-up: today's first typed weight, else last session's top set, else the plan's. */
function workingWeight(e,k){
  const today=((LOGS[k]||{})[e.n]||[]).map(s=>+s.w).find(w=>w>0);if(today)return today;
  const past=historyFor(e.n,3).filter(x=>x.d!==k)[0];
  if(past){const ws=past.sets.map(s=>+s.w).filter(w=>w>0);if(ws.length)return Math.max(...ws);}
  return +e.w||0;
}
function warmState(k){return (SETTINGS.warmDone||{})[k]||null;}
async function warmMark(v){
  const k=curKey(),m=SETTINGS.warmDone=SETTINGS.warmDone||{},cut=keyOf(new Date(Date.now()-14*864e5));
  Object.keys(m).forEach(d=>{if(d<cut)delete m[d];}); // keep two weeks
  if(v)m[k]=v;else delete m[k];
  await set('ir:settings',SETTINGS);render();
}
function vWarm(list,k){
  const mode=warmMode();if(mode==='off'||!list.length)return '';
  const st=warmState(k);
  if(st)return `<button class="tbtn tempo" style="margin-bottom:6px" onclick="IR.warmMark(null)">Warm-up ${st==='done'?'done ✓':'skipped'} · <u>show</u></button>`;
  const muscles=[];list.forEach(e=>(findEx(e.n).m||[]).forEach(m=>{if(!muscles.includes(m))muscles.push(m);}));
  const items=[];
  if(mode!=='stretch')items.push(['General warm-up','About 5 min easy on the rower or ClimbMill']);
  if(mode!=='warmup'){
    const seen=new Set();
    muscles.forEach(m=>{const s=STRETCH[m];if(s&&!seen.has(s[0])&&seen.size<5){seen.add(s[0]);items.push(s);}});
    if(!seen.size)items.push(['Arm circles and leg swings','10 each']);
  }
  if(mode!=='stretch'){
    const c=list.find(e=>isCompound(findEx(e.n)));
    if(c){
      const w=workingWeight(c,k);
      items.push([`Ramp-up: ${c.n}`,w?`${r5(w*.5)} lb × 8, then ${r5(w*.75)} lb × 3 (working weight ${w} lb)`
        :'50% × 8, then 75% × 3 of your working weight']);
    }
  }
  return `<div class="warm"><div class="ex-h"><div class="ex-n">Warm-up</div><span class="muted" style="font-size:11.5px">Not counted in volume</span></div>
    <ol>${items.map(i=>`<li><b>${h(i[0])}</b> <span class="muted">· ${h(i[1])}</span></li>`).join('')}</ol>

      <button class="btn sm ghost" onclick="IR.warmMark('skip')">Skip</button></div></div>`;
}

/* ================= missed-rep adjustment (Phase 3) =================
   A completed set below the bottom of its rep range asks: lower the weight
   (Epley estimate, rounded DOWN to the equipment's step) or keep the weight
   and aim for the reps achieved up to +2. The choice is stored on the session
   (SESS[k].adj[name]), applies to the rest of today's sets, and is next
   session's starting point. Readiness rules (rough = fewer sets) are separate. */
const STEPS_DEFAULT={machine:10,cable:5,bar:45,plate:2.5};
const steps=()=>Object.assign({},STEPS_DEFAULT,SETTINGS.steps||{});
/* Equipment for built-ins is inferred; custom exercises carry their own. */
function eqOf(x){
  if(x.eq)return x.eq;
  if(['Cardio','Mobility'].includes(x.cat))return 'Cardio machine';
  if(/^(Push-up|Pull-up|Dips|Plank|Hanging Leg Raise)$/.test(x.n))return 'Bodyweight';
  if(x.q)return 'Machine';
  if(/Barbell|Romanian Deadlift|Good Morning|Hip Thrust/.test(x.n))return 'Barbell';
  if(/\bDB\b|Dumbbell|Goblet|Hammer Curl|Bulgarian|Walking Lunge|Rear Delt Fly/.test(x.n))return 'Dumbbell';
  if(/Cable|Pushdown|Face Pull|Straight-Arm/.test(x.n))return 'Cable';
  return 'Other';
}
/* Rounds DOWN to a weight the equipment can actually make. */
function roundDown(w,eq){
  const s=steps();
  if(eq==='Barbell'){const pair=2*s.plate;return w<=s.bar?s.bar:s.bar+Math.floor((w-s.bar)/pair+1e-9)*pair;}
  const step=eq==='Machine'?s.machine:eq==='Cable'?s.cable:5;
  return Math.max(step,Math.floor(w/step+1e-9)*step);
}
/* Plates per side for a barbell weight, biggest first. */
function plateMath(w){
  const s=steps();let side=(w-s.bar)/2;if(side<=0)return `just the ${s.bar} lb bar`;
  const out=[];[45,35,25,10,5,2.5,1.25].filter(p=>p>=s.plate).forEach(p=>{while(side>=p-1e-9){out.push(p);side-=p;}});
  return `${s.bar} bar + ${out.join(', ')} per side`;
}
const epley=(w,r)=>w*(1+r/30);
function missPlan(e,row){
  const x=findEx(e.n),eq=eqOf(x),w=+row.w,r=+row.r,adj=(sessRec()||{}).adj?.[e.n];
  const target=adj?adj.lo:+e.lo;
  if(eq==='Cardio machine'||!target||!(r>=1)||r>=target)return null;
  const miss=target-r,keep={w,lo:r,hi:r+2};
  let lower=null;
  if(w>0&&eq!=='Bodyweight'){
    const nw=roundDown(epley(w,r)/(1+target/30),eq);
    if(nw<w)lower={w:nw,lo:target,hi:adj?adj.hi:(+e.hi||target),plates:eq==='Barbell'?plateMath(nw):''};
  }
  return{eq,w,r,target,miss,lower,keep,def:lower&&miss>=3?'lower':'keep'};
}
let missAsk=null; // {name, i, plan} while the prompt is open
function checkMiss(name,i){
  const e=sessEx(curKey(),curDow()).find(x=>x.n===name);if(!e)return;
  const plan=missPlan(e,setRows(curKey(),name)[i]);
  if(plan){missAsk={name,i,plan};drawSheet();}
}
function vMissSheet(){
  const {name,plan:p}=missAsk;
  const opt=(id,title,detail)=>`<button class="${p.def===id?'on':''}" onclick="IR.missChoose('${id}')">
    <b>${title}</b><span>${detail}</span>${p.def===id?'<em>Recommended</em>':''}</button>`;
  return `<div class="card sheet" role="dialog" aria-label="Missed reps">
    <div class="eyebrow">${h(name)} · ${p.w?p.w+' lb × ':''}${p.r} of ${p.target}</div>
    <h3 style="font-size:17px;margin:6px 0 10px">Would you like to lower the weight for more reps, or lower the reps and keep the same weight?</h3>
    <div class="lockpick">
      ${p.lower?opt('lower',`Lower the weight → ${p.lower.w} lb × ${p.target}`,`From your ${p.w} × ${p.r}, rounded down to what the ${p.eq.toLowerCase()} can load.${p.lower.plates?' Load: '+p.lower.plates+'.':''}`):''}
      ${opt('keep',`Keep ${p.w?p.w+' lb':'it'} → aim for ${p.keep.lo}–${p.keep.hi} reps`,`Same weight, a target you can hit today.`)}
    </div>
    <p class="muted" style="font-size:12.5px;margin-top:10px">Applies to your remaining sets of this exercise today and becomes your starting point next time.</p>
    <button class="btn ghost" style="margin-top:10px" onclick="IR.missClose()">Not now</button></div>`;
}
async function missChoose(choice){
  const {name,plan:p}=missAsk;missAsk=null;drawSheet();
  const k=curKey(),s=sessRec();if(!s)return;
  const rows=setRows(k,name),prev={rows:JSON.parse(JSON.stringify(rows)),adj:s.adj&&s.adj[name]?Object.assign({},s.adj[name]):null};
  const pick=choice==='lower'?p.lower:p.keep;
  (s.adj=s.adj||{})[name]={choice,w:pick.w,lo:pick.lo,hi:pick.hi,from:{w:p.w,r:p.r,target:p.target},at:Date.now()};
  rows.forEach(rw=>{if(!rw.done&&pick.w)rw.w=String(pick.w);});
  await set('ir:sessions',SESS);await set('ir:logs',LOGS);render();
  toast(choice==='lower'?`${name}: ${pick.w} lb × ${pick.lo} for the rest`:`${name}: aim for ${pick.lo}–${pick.hi}`,async()=>{
    rows.splice(0,rows.length,...prev.rows);
    if(prev.adj)s.adj[name]=prev.adj;else delete s.adj[name];
    await set('ir:sessions',SESS);await set('ir:logs',LOGS);render();
  });
}
function missClose(){missAsk=null;drawSheet();}
/* Target line for an exercise adjusted today. */
function adjText(a,name){
  const pl=eqOf(findEx(name))==='Barbell'&&a.choice==='lower'?` (${plateMath(a.w)})`:'';
  return a.choice==='lower'?`Adjusted today: ${a.w} lb × ${a.lo}${pl}. You got ${a.from.w} × ${a.from.r}.`
    :`Adjusted today: ${a.w?a.w+' lb, ':''}aim for ${a.lo}–${a.hi} reps. You got ${a.from.r} of ${a.from.target}.`;
}

/* ---- body-type preset switch (2.5) ----
   Adjusts the existing plan instead of rebuilding it: rep ranges move
   proportionally into the new band, rest scales, ClimbMill rounds follow the
   cardio level. Locked days are untouched. Past logs are never rewritten. */
let psw=null; // {to, changes} while the confirm dialog is open
const CARDIO_EX='ClimbMill HIIT';
function presetChanges(to){
  const A=PRESETS[P.preset],B=PRESETS[to],tA=P.t,tB=computeTargets(Object.assign({},P,{preset:to}));
  const band=(x,lo,hi)=>Math.min(hi,Math.max(lo,x));
  const map=x=>Math.round(B.repLow+(band(x,A.repLow,A.repHigh)-A.repLow)*(B.repHigh-B.repLow)/Math.max(1,A.repHigh-A.repLow));
  const ex=[];
  [0,1,2,3,4,5,6].forEach(d=>{
    const day=PLAN[d];if(!day||day.lock)return;
    day.ex.forEach((e,i)=>{
      const c={d,i,n:e.n};
      if(e.n===CARDIO_EX){const s=Math.max(1,e.s+B.cardio-A.cardio);if(s!==e.s)c.s=[e.s,s];}
      else if(e.lo&&e.hi&&/^\d+(\s*[–-]\s*\d+)?$/.test(String(e.r).trim())){
        let lo=map(e.lo),hi=Math.max(lo,map(e.hi));
        if(lo!==e.lo||hi!==e.hi)c.r=[e.r,lo===hi?String(lo):`${lo}–${hi}`,lo,hi];
      }
      if(e.rest&&e.n!==CARDIO_EX){const rs=Math.max(15,Math.round(e.rest*B.restMult/A.restMult/5)*5);if(rs!==e.rest)c.rest=[e.rest,rs];}
      if(c.s||c.r||c.rest)ex.push(c);
    });
  });
  return{from:P.preset,to,band:[`${A.repLow}–${A.repHigh}`,`${B.repLow}–${B.repHigh}`],kcal:[tA.kcal,tB.kcal],prot:[tA.prot,tB.prot],
    cardio:[A.cardio,B.cardio],rest:[A.restMult,B.restMult],ex,locked:[0,1,2,3,4,5,6].filter(d=>PLAN[d]&&PLAN[d].lock).length};
}
function switchPreset(k){
  if(k===P.preset)return;
  psw={to:k,changes:presetChanges(k)};drawSheet();
}
function vPresetSheet(){
  const c=psw.changes,A=PRESETS[c.from],B=PRESETS[c.to],arrow=(a,b)=>`<b>${a} → ${b}</b>`,open=!!openSessKey();
  const rows=c.ex.map(x=>`<div class="stat" style="font-size:12.5px"><span>${dayName(x.d).slice(0,3)} · ${h(x.n)}</span>
    <b style="font-size:11.5px">${[x.r?`${h(x.r[0])} → ${x.r[1]} reps`:'',x.s?`${x.s[0]} → ${x.s[1]} rounds`:'',x.rest?`${x.rest[0]}s → ${x.rest[1]}s rest`:''].filter(Boolean).join(' · ')}</b></div>`).join('');
  return `<div class="card sheet" role="dialog" aria-label="Switch body-type preset">
    <div class="eyebrow">Switch preset</div><h2>${A.label} → ${B.label}</h2>
    <p class="muted" style="margin:6px 0 10px;font-size:13px">${B.truth}</p>
    <div class="stat"><span>Rep ranges</span>${arrow(c.band[0],c.band[1])}</div>
    <div class="stat"><span>Daily calories</span>${arrow(fmt(c.kcal[0]),fmt(c.kcal[1]))}</div>
    <div class="stat"><span>Daily protein</span>${arrow(c.prot[0]+' g',c.prot[1]+' g')}</div>
    <div class="stat"><span>Cardio volume</span>${arrow(`level ${c.cardio[0]}`,`level ${c.cardio[1]}`)}</div>
    <div class="stat"><span>Rest times</span>${arrow('×'+c.rest[0],'×'+c.rest[1])}</div>
    <details class="cues" ${c.ex.length?'':'hidden'}><summary>Every exercise that changes (${c.ex.length})</summary><div style="padding:4px 10px">${rows}</div></details>
    <p class="muted" style="font-size:12.5px;margin-top:10px">Your exercises, order and supersets stay as they are.${c.locked?` ${c.locked} locked day${c.locked>1?'s':''} won't change.`:''}
      ${open?" You're mid-session, so this applies when you finish today's workout.":' Applies from your next session.'} Past logs are never rewritten.</p>
    <div class="row2" style="margin-top:12px"><button class="btn" onclick="IR.presetConfirm()">Switch</button>
      <button class="btn ghost" onclick="IR.presetCancel()">Cancel</button></div></div>`;
}
async function presetConfirm(){
  const to=psw.to;psw=null;drawSheet();
  if(openSessKey()){P.pendingPreset=to;await set('ir:profile',P);render();toast(`Switching to ${PRESETS[to].label} after this session`);return;}
  await applyPreset(to);
}
function presetCancel(){psw=null;drawSheet();render();}
async function cancelPending(){delete P.pendingPreset;await set('ir:profile',P);render();}
async function applyPreset(to){
  const c=presetChanges(to);
  c.ex.forEach(x=>{const e=PLAN[x.d].ex[x.i];
    if(x.r){e.r=x.r[1];e.lo=x.r[2];e.hi=x.r[3];}if(x.s)e.s=x.s[1];if(x.rest)e.rest=x.rest[1];});
  (SETTINGS.presetLog=SETTINGS.presetLog||[]).push({d:todayKey(),from:P.preset,to});
  P.preset=to;delete P.pendingPreset;P.t=computeTargets(P);
  await set('ir:plan',PLAN);await set('ir:settings',SETTINGS);await set('ir:profile',P);
  render();toast(`Now on ${PRESETS[to].label}`);
}

function photoPick(input){
  const file=input.files&&input.files[0];input.value='';
  if(photo&&photo.prev)URL.revokeObjectURL(photo.prev);
  if(!file){photo={err:'No photo came through. Tap the button and try again.'};return renderKeep();}
  if(file.type&&!/^image\//.test(file.type)){photo={err:`That file isn't a photo (${file.type}). Pick an image instead.`};return renderKeep();}
  photo={prev:URL.createObjectURL(file),busy:true};renderKeep();

  }).catch(()=>{
    URL.revokeObjectURL(photo.prev);
    photo={err:`Couldn't read that photo${file.type?' ('+file.type+')':''}. Try again, or take a new one with the camera.`};renderKeep();
  });

/* Shrink to 480px JPEG so a photo is ~30 KB in storage and exports. */
function shrink(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      try{
        if(!im.naturalWidth)throw new Error('Empty image');
        const s=Math.min(1,480/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');
        c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.7));
      }catch(e){URL.revokeObjectURL(url);rej(e);}
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Could not decode'));};
    im.src=url;
  });
}

async function callClaude(content,useSearch){
  const body={model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content}]};
  if(useSearch)body.tools=[{type:"web_search_20250305",name:"web_search"}];
  const r=await fetch("https://api.anthropic.com/v1/messages",
    {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d=await r.json();
  return d.content.filter(x=>x.type==="text").map(x=>x.text).join("\n");
}
function parseJSON(t){
  const c=t.replace(/```json|```/g,'').trim();
  const s=c.indexOf('{'),e=c.lastIndexOf('}');
  return JSON.parse(c.slice(s,e+1));
}
